<!doctype html>
<html lang="ar" dir="rtl" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="theme-color" content="#100b0c" />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Orbitron:wght@600;700;800;900&family=Poppins:wght@400;500;600;700;800&family=Russo+One&family=Tajawal:wght@400;500;700;800&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Orbitron:wght@600;700;800;900&family=Poppins:wght@400;500;600;700;800&family=Russo+One&family=Tajawal:wght@400;500;700;800&display=swap" />
    <link rel="icon" type="image/png" href="/favicon-32x32.png?v=4" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=4" />
    <script>
      (function () {
        try {
          var theme = window.localStorage.getItem('ka-card-theme');
          var safeTheme = theme === 'light' || theme === 'dark' ? theme : 'dark';
          document.documentElement.classList.toggle('dark', safeTheme === 'dark');
          document.documentElement.dataset.theme = safeTheme;
        } catch (error) {
          document.documentElement.classList.add('dark');
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
    <style>
      #app-boot-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(circle at 50% 45%, rgb(217 161 30 / 0.2), transparent 52%),
          radial-gradient(circle at 10% 0%, rgb(200 16 46 / 0.13), transparent 35%),
          linear-gradient(180deg, #241014 0%, #100b0c 100%);
        transition: opacity 240ms ease, visibility 240ms ease;
      }

      #app-boot-loader.is-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .boot-loader__logo {
        width: clamp(140px, 28vw, 210px);
        height: clamp(90px, 19vw, 132px);
        object-fit: contain;
        animation: boot-logo-motion 1.7s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        filter: drop-shadow(0 10px 24px rgb(217 161 30 / 0.38));
      }

      @keyframes boot-logo-motion {
        0% {
          transform: translateY(0) scale(0.985);
        }

        50% {
          transform: translateY(-4px) scale(1);
        }

        100% {
          transform: translateY(0) scale(0.985);
        }
      }

    </style>
  </head>
  <body>
    <div id="app-boot-loader" aria-hidden="true">
      <img class="boot-loader__logo" src="/km-olad-masr-logo.png?v=4" alt="KM اولاد مصر" />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
